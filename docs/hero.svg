<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="dec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="400" rx="18" fill="url(#bg)"/>

  <!-- Host agent -->
  <g filter="url(#s)">
    <rect x="36" y="128" width="200" height="144" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="136" y="160" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="1.5">HOST AGENT</text>
  <text x="136" y="186" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Claude Code</text>
  <text x="136" y="206" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Copilot CLI</text>
  <text x="136" y="232" text-anchor="middle" fill="#94a3b8" font-size="12">plans · types text</text>
  <text x="136" y="250" text-anchor="middle" fill="#94a3b8" font-size="12">checks the result</text>

  <!-- dpw daemon -->
  <g filter="url(#s)">
    <rect x="330" y="96" width="300" height="208" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="480" y="124" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">DPW DAEMON · PLAYWRIGHT</text>

  <!-- Decision pill -->
  <rect x="356" y="140" width="248" height="58" rx="12" fill="url(#dec)"/>
  <text x="480" y="165" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Microsoft-Decision-1.1</text>
  <text x="480" y="185" text-anchor="middle" fill="#dbeafe" font-size="12">~0.15 s per step · one choice</text>

  <!-- ops -->
  <g font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
    <rect x="356" y="214" width="56" height="26" rx="13" fill="#1e293b" stroke="#3b82f6"/><text x="384" y="231">click</text>
    <rect x="420" y="214" width="58" height="26" rx="13" fill="#1e293b" stroke="#3b82f6"/><text x="449" y="231">select</text>
    <rect x="486" y="214" width="56" height="26" rx="13" fill="#1e293b" stroke="#3b82f6"/><text x="514" y="231">scroll</text>
    <rect x="550" y="214" width="54" height="26" rx="13" fill="#1e293b" stroke="#3b82f6"/><text x="577" y="231">back</text>
  </g>
  <!-- loop arrow -->
  <path d="M604,252 C640,270 640,170 606,160" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="480" y="278" text-anchor="middle" fill="#64748b" font-size="11">observe page → choose → act → repeat</text>

  <!-- Browser -->
  <g filter="url(#s)">
    <rect x="724" y="128" width="200" height="144" rx="14" fill="#f8fafc"/>
    <rect x="724" y="128" width="200" height="26" rx="14" fill="#e2e8f0"/>
    <rect x="724" y="141" width="200" height="13" fill="#e2e8f0"/>
  </g>
  <circle cx="742" cy="141" r="4" fill="#ef4444"/><circle cx="756" cy="141" r="4" fill="#f59e0b"/><circle cx="770" cy="141" r="4" fill="#22c55e"/>
  <rect x="740" y="168" width="168" height="10" rx="5" fill="#cbd5e1"/>
  <rect x="740" y="186" width="120" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="740" y="208" width="168" height="22" rx="6" fill="#fff" stroke="#94a3b8"/>
  <rect x="740" y="240" width="70" height="20" rx="6" fill="#2563eb"/>
  <text x="824" y="290" text-anchor="middle" fill="#94a3b8" font-size="12">Chrome · Edge · Chromium</text>

  <!-- arrows host -> daemon -->
  <line x1="236" y1="170" x2="326" y2="170" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="281" y="161" text-anchor="middle" fill="#cbd5e1" font-size="12" font-family="ui-monospace, Consolas, monospace">run</text>
  <line x1="326" y1="232" x2="236" y2="232" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#ag)"/>
  <text x="281" y="252" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="ui-monospace, Consolas, monospace">NEEDS_TYPING</text>
  <path d="M236,200 L326,200" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <text x="281" y="194" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="ui-monospace, Consolas, monospace">type · resume</text>

  <!-- daemon -> browser -->
  <line x1="630" y1="200" x2="720" y2="200" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="720" y1="220" x2="630" y2="220" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="675" y="192" text-anchor="middle" fill="#cbd5e1" font-size="11">act</text>
  <text x="675" y="238" text-anchor="middle" fill="#64748b" font-size="11">DOM</text>

  <!-- title -->
  <text x="36" y="56" fill="#f8fafc" font-size="26" font-weight="800">decision-playwright</text>
  <text x="36" y="82" fill="#94a3b8" font-size="14">A fast model clicks. Your agent only types and checks.</text>

  <!-- footer chips -->
  <g font-size="12" fill="#cbd5e1">
    <rect x="36" y="330" width="210" height="34" rx="17" fill="#111827" stroke="#1f2937"/>
    <text x="141" y="352" text-anchor="middle"><tspan fill="#60a5fa" font-weight="700">0.15 s</tspan> Decision step (server)</text>
    <rect x="258" y="330" width="230" height="34" rx="17" fill="#111827" stroke="#1f2937"/>
    <text x="373" y="352" text-anchor="middle"><tspan fill="#a78bfa" font-weight="700">60/60</tspan> correct next action</text>
    <rect x="500" y="330" width="210" height="34" rx="17" fill="#111827" stroke="#1f2937"/>
    <text x="605" y="352" text-anchor="middle"><tspan fill="#34d399" font-weight="700">−60%</tspan> agent output tokens</text>
    <rect x="722" y="330" width="202" height="34" rx="17" fill="#111827" stroke="#1f2937"/>
    <text x="823" y="352" text-anchor="middle"><tspan fill="#fbbf24" font-weight="700">5</tspan> providers · 1 skill</text>
  </g>
</svg>
