<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="18" fill="#0b1220"/>

  <!-- Left: one-step latency -->
  <text x="36" y="44" fill="#f8fafc" font-size="17" font-weight="700">One step: choose the next action</text>
  <text x="36" y="66" fill="#94a3b8" font-size="12">Median, same page and elements, 60 calls each · all 60/60 correct</text>
  <g font-size="13">
    <text x="36" y="110" fill="#e2e8f0">Decision-1.1</text>
    <rect x="150" y="96" width="44" height="22" rx="6" fill="url(#g1)"/>
    <text x="202" y="112" fill="#93c5fd" font-weight="700">0.75 s</text>
    <text x="260" y="112" fill="#64748b" font-size="11">(0.15 s at the gateway)</text>

    <text x="36" y="150" fill="#e2e8f0">gpt-6-astra</text>
    <rect x="150" y="136" width="117" height="22" rx="6" fill="#475569"/>
    <text x="275" y="152" fill="#cbd5e1" font-weight="700">1.96 s</text>

    <text x="36" y="190" fill="#e2e8f0">gpt-6.1-terra</text>
    <rect x="150" y="176" width="195" height="22" rx="6" fill="#475569"/>
    <text x="353" y="192" fill="#cbd5e1" font-weight="700">3.26 s</text>
  </g>
  <text x="36" y="232" fill="#64748b" font-size="11">Client time from Korea to East US 2 includes ~0.6 s network + TLS.</text>
  <text x="36" y="250" fill="#64748b" font-size="11">A Korea Central deployment measured 0.27 s per new connection.</text>

  <line x1="470" y1="30" x2="470" y2="300" stroke="#1f2937"/>

  <!-- Right: region -->
  <text x="500" y="44" fill="#f8fafc" font-size="17" font-weight="700">Decision-1.1 by deployment region</text>
  <text x="500" y="66" fill="#94a3b8" font-size="12">Median, called from Seoul, new connection per call, 30 calls</text>
  <g font-size="13">
    <text x="500" y="110" fill="#e2e8f0">Korea Central</text>
    <rect x="640" y="96" width="50" height="22" rx="6" fill="url(#g2)"/>
    <text x="698" y="112" fill="#6ee7b7" font-weight="700">0.27 s</text>

    <text x="500" y="150" fill="#e2e8f0">AI Gateway (US)</text>
    <rect x="640" y="136" width="128" height="22" rx="6" fill="#475569"/>
    <text x="776" y="152" fill="#cbd5e1" font-weight="700">0.69 s</text>

    <text x="500" y="190" fill="#e2e8f0">East US 2</text>
    <rect x="640" y="176" width="162" height="22" rx="6" fill="#475569"/>
    <text x="810" y="192" fill="#cbd5e1" font-weight="700">0.88 s</text>
  </g>
  <text x="500" y="232" fill="#64748b" font-size="11">GlobalStandard: Azure picks the inference region</text>
  <text x="500" y="250" fill="#64748b" font-size="11">(Korea Central → Australia East, East US 2 → South Central US).</text>

  <text x="36" y="300" fill="#475569" font-size="11">Measured 2026-11-25 · bench scripts and raw results: see docs/benchmark.md</text>

  <defs>
    <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  </defs>
</svg>
