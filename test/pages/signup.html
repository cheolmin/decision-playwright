<!doctype html><title>Create account</title><h1>Create account</h1>
<form action="welcome.html">
<label for="name">Full name</label><input id="name" name="name"><br>
<label for="email">Email</label><input id="email" name="email" type="email"><br>
<label for="country">Country</label><select id="country" name="country"><option value="">Choose...</option><option>United States</option><option>Korea</option><option>Japan</option><option>Germany</option></select><br>
<fieldset><legend>Plan</legend><label><input type="radio" name="plan" value="Basic" checked> Basic plan</label> <label><input type="radio" name="plan" value="Pro"> Pro plan</label> <label><input type="radio" name="plan" value="Team"> Team plan</label></fieldset>
<label><input type="checkbox" name="news" value="yes" checked> Send me newsletters</label><br>
<label><input type="checkbox" name="terms" value="yes" required> I accept the terms</label><br>
<button type="submit">Create account</button></form>
